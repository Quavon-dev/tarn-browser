name: Chromium update

# Proposes the newest stable CEF build, with the cef crate that builds against it, as a pull
# request; once a maintainer has reviewed and merged it, tags the merge and calls release.yml, which
# signs and publishes it after a maintainer approves its release-signing deployment.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [packaging/cef.lock]

permissions: {}

defaults:
  run:
    shell: bash

# A push run (one per merged update) never waits behind, or is replaced by, the scheduled checks.
concurrency:
  group: chromium-update-${{ github.event_name == 'push' && github.sha || 'watch' }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      cef_crate: ${{ steps.find.outputs.cef_crate }}
      cef_version: ${{ steps.find.outputs.cef_version }}
      chromium_version: ${{ steps.find.outputs.chromium_version }}
      release_date: ${{ steps.find.outputs.release_date }}
      sha256_macosarm64: ${{ steps.find.outputs.sha256_macosarm64 }}
      sha256_macosx64: ${{ steps.find.outputs.sha256_macosx64 }}
      sha256_windows64: ${{ steps.find.outputs.sha256_windows64 }}
      stale: ${{ steps.find.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() { curl --proto '=https' --tlsv1.2 -sSfL --max-time 900 "$@"; }
          newer() { [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]; }
          history=https://versionhistory.googleapis.com/v1/chrome/platforms/mac/channels
          pinned="$(grep -E '^chromium_version=' packaging/cef.lock | cut -d= -f2-)"
          pinned_crate="$(grep -A1 '^name = "cef"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          [[ "$pinned_crate" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+\.[0-9]+\.[0-9]+$ ]]

          fetch -o serving.json "$history/stable/versions/all/releases?filter=endtime=none"
          latest="$(jq -r '[.releases[] | {v: .version, d: .serving.startTime[:10]}] | sort_by(.v | split(".") | map(tonumber)) | last | "\(.v) \(.d)"' serving.json)"
          stale=false
          if newer "${latest% *}" "$pinned" && [[ "${latest#* }" < "$(date -u -d '7 days ago' +%F)" ]]; then stale=true; fi
          none() { echo "$1"; echo "stale=$stale" >> "$GITHUB_OUTPUT"; exit 0; }

          # The newest cef crate, released with its cef-dll-sys and not older than the pinned one, that
          # has a stable CEF build on every platform: cef-dll-sys builds only against its own CEF or an
          # older build of its branch.
          fetch -o index.json https://cef-builds.spotifycdn.com/index.json
          builds="$(jq -r '[.macosarm64.versions[], .macosx64.versions[], .windows64.versions[]]
            | map(select(.channel == "stable") | .cef_version) | group_by(.) | map(select(length == 3) | .[0]) | .[]' index.json | sort -V)"
          fetch -o cef.crates https://index.crates.io/3/c/cef
          fetch -o cef-dll-sys.crates https://index.crates.io/ce/f-/cef-dll-sys
          released() { jq -r 'select(.yanked | not) | .vers' "$1" | sort; }
          crates="$(comm -12 <(released cef.crates) <(released cef-dll-sys.crates) \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -rV)"
          crate=""
          cef=""
          while read -r candidate; do
            if [[ -z "$candidate" ]] || newer "$pinned_crate" "$candidate"; then break; fi
            ceiling="${candidate#*+}"
            while read -r version; do
              base="${version%%+*}"
              if [[ "${base%.*}" == "${ceiling%.*}" ]] && ! newer "$base" "$ceiling"; then cef="$version"; fi
            done <<<"$builds"
            if [[ -n "$cef" ]]; then crate="$candidate"; break; fi
          done <<<"$crates"
          [[ -n "$cef" ]] || none "no stable CEF build for a cef crate from $pinned_crate on"
          [[ "$cef" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+g[0-9a-f]{7}\+chromium-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chromium="${cef##*+chromium-}"
          newer "$chromium" "$pinned" || none "CEF $cef is not newer than Chromium $pinned"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/chromium-update/${cef//+/%2B}" >/dev/null 2>&1; then none "CEF $cef already proposed"; fi
          # CEF's stable builds follow Chrome's extended stable channel as often as its stable one.
          fetch -o releases.json "$history/all/versions/all/releases?filter=version=$chromium"
          date="$(jq -r '[.releases[] | select(.name | test("/channels/(stable|extended)/")) | .serving.startTime[:10]] | min // empty' releases.json)"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || none "Chromium $chromium is not on Google's stable list"

          {
            echo "cef_crate=$crate"
            echo "cef_version=$cef"
            echo "chromium_version=$chromium"
            echo "release_date=$date"
            for platform in macosarm64 macosx64 windows64; do
              name="cef_binary_${cef}_${platform}_minimal"
              fetch -o "$platform.tar.bz2" "https://cef-builds.spotifycdn.com/${name//+/%2B}.tar.bz2"
              echo "sha256_$platform=$(sha256sum "$platform.tar.bz2" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_OUTPUT"

  propose:
    needs: watch
    if: needs.watch.outputs.cef_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      branch: ${{ steps.commit.outputs.branch }}
    env:
      CEF_CRATE: ${{ needs.watch.outputs.cef_crate }}
      CEF_VERSION: ${{ needs.watch.outputs.cef_version }}
      CHROMIUM_VERSION: ${{ needs.watch.outputs.chromium_version }}
      RELEASE_DATE: ${{ needs.watch.outputs.release_date }}
      SHA256_MACOSARM64: ${{ needs.watch.outputs.sha256_macosarm64 }}
      SHA256_MACOSX64: ${{ needs.watch.outputs.sha256_macosx64 }}
      SHA256_WINDOWS64: ${{ needs.watch.outputs.sha256_windows64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - id: commit
        # Only this file's commands run; nothing from the branch is executed.
        run: |
          branch="chromium-update/$CEF_VERSION"
          printf '%s\n' "cef_version=$CEF_VERSION" "chromium_version=$CHROMIUM_VERSION" "release_date=$RELEASE_DATE" \
            "host=cef-builds.spotifycdn.com" "sha256_macosarm64=$SHA256_MACOSARM64" "sha256_macosx64=$SHA256_MACOSX64" \
            "sha256_windows64=$SHA256_WINDOWS64" > packaging/cef.lock
          old="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          new="${old%.*}.$(( ${old##*.} + 1 ))"
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \"$old\"$/version = \"$new\"/" Cargo.toml
          cargo update --workspace
          for dir in linux mobile nsh-shared fuzz; do (cd "$dir" && cargo update --workspace); done
          pinned_crate="$(grep -A1 '^name = "cef"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [[ "$CEF_CRATE" != "$pinned_crate" ]]; then
            cp linux/Cargo.lock "$RUNNER_TEMP/linux.lock"
            grep -rlE '^cef = \{ version = "=' --include=Cargo.toml crates \
              | xargs sed -i "s/^cef = { version = \"=${pinned_crate%%+*}\"/cef = { version = \"=${CEF_CRATE%%+*}\"/"
            for dir in . linux mobile nsh-shared fuzz; do
              (cd "$dir" && cargo update -p cef --precise "$CEF_CRATE" && grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | grep -qxF "version = \"$CEF_CRATE\"")
            done
            python3 -I - "$RUNNER_TEMP/linux.lock" linux/Cargo.lock linux/packaging/flatpak/cargo-sources.json <<'EOF'
          import sys, tomllib
          from pathlib import Path
          def crates(path):
              return {(p["name"], p["version"], p["checksum"]) for p in tomllib.loads(Path(path).read_text())["package"] if "checksum" in p}
          old, new = crates(sys.argv[1]), crates(sys.argv[2])
          gone, came = old - new, new - old
          names = sorted(name for name, _, _ in gone)
          if names != sorted(name for name, _, _ in came) or len(set(names)) != len(names):
              sys.exit("linux/Cargo.lock gained or lost crates: run linux/packaging/flatpak/update-cargo-sources.sh by hand")
          sources = Path(sys.argv[3])
          text = sources.read_text()
          for name, version, checksum in gone:
              _, to_version, to_checksum = next(c for c in came if c[0] == name)
              for end in (".crate", '"'):
                  text = text.replace(f"/{name}-{version}{end}", f"/{name}-{to_version}{end}")
              text = text.replace(checksum, to_checksum)
          sources.write_text(text)
          EOF
            scripts/third-party-licenses.sh
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -s -m "build: Chromium $CHROMIUM_VERSION (CEF $CEF_VERSION)" -- packaging/cef.lock Cargo.toml Cargo.lock linux/Cargo.lock mobile/Cargo.lock nsh-shared/Cargo.lock fuzz/Cargo.lock \
            crates/*/Cargo.toml packaging/third-party-licenses*.txt linux/packaging/flatpak/cargo-sources.json
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

  open:
    needs: [watch, propose]
    if: needs.propose.outputs.commit != ''
    runs-on: ubuntu-24.04
    # The app opens the pull request, so CI runs on it as on any other (a pull request opened with
    # the workflow token starts no workflows); its key is a secret of an environment only main can use.
    environment: chromium-update
    permissions: {}
    env:
      BRANCH: ${{ needs.propose.outputs.branch }}
      CHROMIUM_VERSION: ${{ needs.watch.outputs.chromium_version }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHROMIUM_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHROMIUM_UPDATE_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          open="$(gh api "$api/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH//+/%2B}&state=open" --jq length)"
          [[ "$open" != 0 ]] || gh api "$api/pulls" -f base=main -f head="$BRANCH" -f title="build: Chromium $CHROMIUM_VERSION (${BRANCH#chromium-update/})" \
            -f body="Automatic engine update. Review the change to packaging/cef.lock and, when the cef crate moves, its pins, the cef crates in the lockfiles, the licence lists and the Flatpak sources; merge once CI passes. chromium-update.yml then tags the merge and starts its macOS release, or, when the cef crate moved, leaves the release to a maintainer (docs/release.md, Automatic engine updates)." >/dev/null

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The update app may create v* tags (tag ruleset); only main can use this environment.
    environment: chromium-update
    permissions: {}
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      cef: ${{ steps.tag.outputs.cef }}
      pending: ${{ steps.tag.outputs.pending }}
      tag: ${{ steps.tag.outputs.tag }}
    env:
      COMMIT: ${{ github.sha }}
      APP: ${{ vars.CHROMIUM_UPDATE_APP_SLUG }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHROMIUM_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHROMIUM_UPDATE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - id: tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        # Only a merged pull request of the app's own chromium-update branch is released here; other
        # changes to packaging/cef.lock are released with a maintainer-started release.
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          read -r pr branch < <(gh api "$api/commits/$COMMIT/pulls" | jq -r --arg app "${APP}[bot]" \
            '[.[] | select(.merged_at != null and (.head.ref | startswith("chromium-update/")) and .user.login == $app)][0] // {} | "\(.number // "") \(.head.ref // "")"')
          [[ -n "$pr" ]] || { echo "$COMMIT is not the merge of an engine update pull request"; exit 0; }
          # A push to the update branch could change the pinned build; fetch-cef.sh already refuses
          # another host or a wrong hash, so the lock must name exactly the build the branch is for.
          lock="$(gh api "$api/contents/packaging/cef.lock?ref=$COMMIT" --jq .content | base64 -d)"
          cef="$(sed -n 's/^cef_version=//p' <<<"$lock")"
          chromium="$(sed -n 's/^chromium_version=//p' <<<"$lock")"
          [[ "$cef" == "${branch#chromium-update/}" && "$chromium" == "${cef##*+chromium-}" ]] \
            || { echo "packaging/cef.lock names CEF '$cef' (Chromium '$chromium'), not the build of $branch" >&2; exit 1; }
          # Against main before the merge, only the pinned build and the version may change: in
          # Cargo.toml and the lockfiles, any changed line other than a `version = "…"` line (a
          # dependency, source, checksum or patch) means the branch was edited.
          parent="$(gh api "$api/commits/$COMMIT" --jq '.parents[0].sha')"
          gh api "$api/compare/$parent...$COMMIT" > compare.json
          extra="$(jq -r '.files[].filename' compare.json \
            | grep -vxE 'packaging/cef\.lock|Cargo\.toml|Cargo\.lock|(linux|mobile|nsh-shared|fuzz)/Cargo\.lock|crates/[^/]+/Cargo\.toml|packaging/third-party-licenses(-[a-z]+)?\.txt|linux/packaging/flatpak/cargo-sources\.json' || true)"
          [[ -z "$extra" ]] || { echo "the merge also changes $extra; release it by hand" >&2; exit 1; }
          # A merge that moves the cef crate is never tagged here; report opens an issue for its release.
          if jq -r '.files[].filename' compare.json | grep -qE '^crates/[^/]+/Cargo\.toml$'; then
            echo "::notice::$COMMIT moves the cef crate: not tagged; release it from GitHub as docs/release.md describes"
            printf '%s\n' "pending=true" "cef=$cef" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other="$(jq -r '.files[] | select(.filename != "packaging/cef.lock") | if .patch == null then "no patch for \(.filename)" else .patch end' compare.json \
            | grep -E '^([+-]|no patch)' | grep -vE '^[+-]version = "[0-9]+\.[0-9]+\.[0-9]+"$' || true)"
          [[ -z "$other" ]] || { echo "the merge changes more than versions: $other" >&2; exit 1; }
          version="$(gh api "$api/contents/Cargo.toml?ref=$COMMIT" --jq .content | base64 -d \
            | sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cargo.toml has no release version at $COMMIT" >&2; exit 1; }
          tagged="$(gh api "$api/git/ref/tags/v$version" --jq .object.sha 2>/dev/null || true)"
          if [[ -z "$tagged" ]]; then
            gh api "$api/git/refs" -f ref="refs/tags/v$version" -f sha="$COMMIT" >/dev/null
          elif [[ "$tagged" != "$COMMIT" ]]; then
            echo "v$version already names $tagged: raise the version on main and release by hand" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.commit != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ needs.tag.outputs.commit }}
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

  report:
    needs: [watch, propose, open, tag, build]
    if: always() && (contains(needs.*.result, 'failure') || needs.watch.outputs.stale == 'true' || needs.tag.outputs.pending == 'true')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      PENDING: ${{ needs.tag.outputs.pending == 'true' }}
      CEF_VERSION: ${{ needs.watch.outputs.cef_version || needs.tag.outputs.cef || needs.tag.outputs.tag || github.sha }}
    steps:
      - run: |
          next="for how to retry"
          if [[ "$FAILED" == true ]]; then
            title="Chromium update ${CEF_VERSION:-check} failed"
          elif [[ "$PENDING" == true ]]; then
            title="Chromium update ${CEF_VERSION} merged, release pending"
            next="for how to release it"
          else
            title="Chromium not updated seven days after a Chrome stable release"
          fi
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open="$(gh issue list --label security --state open --search "\"$title\" in:title" --json number --jq length)"
          [[ "$open" != 0 ]] || gh issue create --label security --title "$title" \
            --body "See $run and docs/release.md (Automatic engine updates) $next."
