name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

# A newer push to a pull request or to main replaces the older run, so queued macOS runners are not
# spent on commits nobody releases; release and nightly builds only use main's latest commit.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Jobs a change does not touch are skipped; a skipped required job counts as passed.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      shared: ${{ steps.diff.outputs.shared }}
      nsh: ${{ steps.diff.outputs.nsh }}
      mobile: ${{ steps.diff.outputs.mobile }}
      linux: ${{ steps.diff.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ inputs.commit && 'workflow_call' || github.event_name }}
          SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # engine, app, ui and ai need macOS (WebKit, AppKit, Keychain), sync depends on engine, and
    # platform's XPC code is macOS-only; the macos job checks them. browser-core builds everywhere.
    runs-on: ubuntu-24.04
    env:
      CRATES: -p store -p shield -p devkit -p filter-bundle -p cli-bridge -p platform -p chromium-helper -p browser-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: for d in . nsh-shared mobile linux; do (cd "$d" && cargo fmt --all --check); done
      - run: scripts/check-workflows.sh && scripts/check-workflows.test.sh && scripts/ci-changes.test.sh
      - run: scripts/third-party-licenses.sh --check
      - run: cargo clippy $CRATES --all-targets --locked -- -D warnings
      - run: cargo test $CRATES --locked

  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.shared != 'false' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CRATES: -p engine -p browser-core -p app -p ui -p sync -p ai -p platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # scripts/fetch-cef.sh checks the cached archive's SHA-256 against packaging/cef.lock.
          cache-directories: target/cef/downloads
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy $CRATES --all-targets --locked -- -D warnings
      - run: cargo test $CRATES --locked
      - run: scripts/dmg.test.sh && scripts/windows-feed.test.sh
      - name: Chromium feature
        run: |
          scripts/fetch-ninja.sh "$RUNNER_TEMP/ninja"
          export PATH="$RUNNER_TEMP/ninja:$PATH"
          cef="$(scripts/fetch-cef.sh)"
          CEF_PATH="$cef" cargo clippy -p app -p engine -p chromium-helper --features app/chromium,chromium-helper/chromium --all-targets --locked -- -D warnings
          CEF_PATH="$cef" cargo test -p engine --features chromium --test early_malloc_zone --locked

  windows:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.shared != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # scripts/fetch-cef.sh checks the cached archive's SHA-256 against packaging/cef.lock.
          cache-directories: target/cef/downloads
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: echo "CEF_PATH=$(cygpath -w "$(scripts/fetch-cef.sh windows64)")" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Links tarn.dll, whose delay-load flags apply only to the real cdylib.
      - run: cargo build --locked -p app-dll
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.test.ps1

  nsh-shared:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.nsh != 'false' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nsh-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: nsh-shared
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  mobile:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.mobile != 'false' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      NSH_RELEASE: https://github.com/longbridge/nsh/releases/download/v0.5.0
      NSH_SHA256: e6722427b391b00cf7ec13137db9366e78d1e7a045f2933cf00b340365309d9d
      NSH_ANDROID_SHA256: bd9f42c043c08f0c29c874d2a8247e389258f88778a5160d646f73fc2ccfbe73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy
          targets: aarch64-apple-ios-sim, aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile -> target
          # nsh builds the apps as its own generated workspace into mobile/app/target; a workspace
          # entry would prune that workspace's crates (nsh-platform-android, ...) before saving.
          cache-directories: |
            mobile/app/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: iOS simulator
        run: cargo clippy --target aarch64-apple-ios-sim --all-targets --locked -- -D warnings
      - name: Android
        # nsh-testing's QuickJS bindings do not build for Android, so tests and dev-dependencies stay on the host.
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android28-clang" AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --target aarch64-linux-android --locked -- -D warnings
      - name: Android debug APK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nsh.tar.gz" "$NSH_RELEASE/nsh-macos-arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/nsh-android.tar.gz" "$NSH_RELEASE/nsh-android.tar.gz"
          echo "$NSH_SHA256  $RUNNER_TEMP/nsh.tar.gz" | shasum -a 256 -c -
          echo "$NSH_ANDROID_SHA256  $RUNNER_TEMP/nsh-android.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/nsh.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/nsh-android.tar.gz" -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/nsh/bin:$PATH" android/build.sh

  # The device app, linked as release.yml does (clippy for the simulator does not link), next to
  # the mobile job instead of after it.
  ios:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.mobile != 'false' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NSH_RELEASE: https://github.com/longbridge/nsh/releases/download/v0.5.0
      NSH_SHA256: e6722427b391b00cf7ec13137db9366e78d1e7a045f2933cf00b340365309d9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile -> target
          # As in the mobile job: kept whole, since it holds nsh's generated workspace.
          cache-directories: mobile/app/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/nsh.tar.gz" "$NSH_RELEASE/nsh-macos-arm64.tar.gz"
          echo "$NSH_SHA256  $RUNNER_TEMP/nsh.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/nsh.tar.gz" -C "$RUNNER_TEMP"
      - name: iOS device build
        working-directory: mobile/app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: PATH="$RUNNER_TEMP/nsh/bin:$PATH" nsh package --target ios -o "$RUNNER_TEMP/ios"

  linux:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.linux != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: fedora:43@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5
    steps:
      - run: >-
          dnf -y install git gcc gcc-c++ clang pkgconf-pkg-config gtk4-devel webkitgtk6.0-devel
          gstreamer1-devel gstreamer1-plugins-base-devel xorg-x11-server-Xvfb mesa-dri-drivers dbus-daemon python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: linux
      - run: cargo test --locked
        working-directory: linux
      - name: WebKitGTK display tests (Xvfb)
        run: linux/scripts/display-tests.sh

  flatpak:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.linux != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: linux/packaging/flatpak/check-cargo-sources.sh
      - run: linux/packaging/flatpak/local-manifest.sh
      - run: test -s /etc/machine-id || dbus-uuidgen --ensure=/etc/machine-id
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: >-
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean
          --repo=repo build linux/packaging/flatpak/de.quavon.tarn.local.yml
      - run: flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$PWD/linux/packaging/flatpak/de.quavon.tarn.yml"
      - run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream "$PWD/linux/packaging/flatpak/de.quavon.tarn.metainfo.xml"

  deny:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # A new advisory in any crate must not hold back chromium-update.yml's engine update;
          # audit.yml checks advisories nightly.
          command: check ${{ inputs.commit && 'bans licenses sources' || 'advisories bans licenses sources' }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !inputs.commit }}
        with:
          manifest-path: mobile/Cargo.toml
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !inputs.commit }}
        with:
          manifest-path: nsh-shared/Cargo.toml
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !inputs.commit }}
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories bans licenses sources

  coverage:
    needs: changes
    if: ${{ !cancelled() && !inputs.commit && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LLVM_COV_SHA256  $RUNNER_TEMP/cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" -C "$HOME/.cargo/bin" cargo-llvm-cov
      - run: >-
          cargo llvm-cov --locked --no-report -p store -p shield -p devkit -p filter-bundle -p cli-bridge
          -p platform -p chromium-helper -p browser-core
      - run: |
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json
          jq -r --arg root "$GITHUB_WORKSPACE/" '
            def crate: ltrimstr($root) | split("/")[:2] | join("/");
            "| Crate | Lines | Covered | % |", "|---|---:|---:|---:|",
            (.data[0].files | group_by(.filename | crate)[]
              | {name: (.[0].filename | crate), count: (map(.summary.lines.count) | add), covered: (map(.summary.lines.covered) | add)}
              | "| \(.name) | \(.count) | \(.covered) | \(if .count > 0 then (.covered * 1000 / .count | round / 10) else 0 end) |"),
            (.data[0].totals.lines | "| **total** | \(.count) | \(.covered) | \(.percent * 10 | round / 10) |")
          ' coverage/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
