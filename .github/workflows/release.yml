name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      tag:
        type: string
        required: true
      nightly:
        type: boolean
        default: false
      version:
        type: string
        default: ""
      # start-release.yml: every client, and the sign job creates the tag once a maintainer approves.
      full:
        type: boolean
        default: false
      critical:
        type: boolean
        default: false
    # Environment secrets reach a called workflow only when its caller passes them by name; the sign
    # job then gets the release-signing or nightly-signing value.
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      NOTARY_API_KEY:
        required: false
      NOTARY_API_KEY_ID:
        required: false
      NOTARY_API_ISSUER:
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        required: false
      CHROMIUM_UPDATE_APP_KEY:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CYCLONEDX_VERSION: 0.5.10
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # The update app's tag is built by chromium-update.yml, which calls this workflow itself.
    if: inputs.commit != '' || github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG)
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      # Left unsigned for the sign job, which holds the keys and runs no build code.
      TARN_SIGN_IDENTITY: none
      # The unsandboxed bundle moves a sandboxed install's data out of its container once.
      TARN_RELEASE_BUILD: "1"
    steps:
      - if: inputs.commit == '' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "run the macOS-only release on a release tag: gh workflow run release.yml --ref vX.Y.Z" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - if: inputs.commit == '' || inputs.full
        run: scripts/check-version.sh "$TAG"
      - if: inputs.nightly
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "nightly version '$VERSION' is not 1.2.3.4" >&2; exit 1; }
          echo "TARN_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: |
          scripts/fetch-ninja.sh "$RUNNER_TEMP/ninja"
          echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"
      - run: scripts/bundle.sh
      - run: |
          mkdir dist
          ditto -c -k --keepParent target/release/Tarn.app "dist/Tarn-${TAG}-unsigned.zip"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/
          if-no-files-found: error

  # ClusterFuzzLite's actions always fuzz the triggering commit, not inputs.commit.
  fuzz:
    if: inputs.commit != '' || (startsWith(github.ref, 'refs/tags/v') && github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - run: docker build -t tarn-fuzz -f .clusterfuzzlite/Dockerfile .
      - run: |
          mkdir crashes
          docker run --rm -e SANITIZER=address -e FUZZING_ENGINE=libfuzzer -e FUZZING_LANGUAGE=rust -e ARCHITECTURE=x86_64 \
            -v "$PWD/crashes:/crashes" tarn-fuzz bash -euo pipefail -c '
              compile
              for source in fuzz/fuzz_targets/*.rs; do
                target="$(basename "$source" .rs)"
                corpus="$(mktemp -d)"
                if [[ -f "$OUT/${target}_seed_corpus.zip" ]]; then unzip -q "$OUT/${target}_seed_corpus.zip" -d "$corpus"; fi
                echo "::group::$target"
                "$OUT/$target" -max_total_time=60 -timeout=25 -rss_limit_mb=2560 -artifact_prefix="/crashes/$target-" "$corpus"
                echo "::endgroup::"
              done'
          echo "Fuzzed $(git rev-parse HEAD) under AddressSanitizer: every target for 60 s from its seeds, no crash." >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore

  deny:
    if: inputs.commit != '' || (startsWith(github.ref, 'refs/tags/v') && github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        manifest: [Cargo.toml, linux/Cargo.toml, mobile/Cargo.toml, nsh-shared/Cargo.toml, fuzz/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories bans licenses sources
      - if: matrix.manifest == 'Cargo.toml'
        run: scripts/check-vex.sh

  windows:
    # Engine updates (chromium-update.yml) and manual runs ship the macOS bundle alone, without waiting for the rest.
    if: (github.event_name == 'push' || inputs.nightly || inputs.full) && github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG)
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
      INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - if: ${{ !inputs.nightly }}
        run: scripts/check-version.sh "$TAG"
      - if: inputs.nightly
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "nightly version '$VERSION' is not 1.2.3.4" >&2; exit 1; }
          echo "TARN_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: echo "CEF_PATH=$(cygpath -w "$(scripts/fetch-cef.sh windows64)")" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p app-dll
        env:
          TARN_RELEASE_BUILD: "1"
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/innosetup.exe" "$INNO_SETUP_URL"
          echo "$INNO_SETUP_SHA256  $RUNNER_TEMP/innosetup.exe" | sha256sum -c -
          MSYS2_ARG_CONV_EXCL='*' "$RUNNER_TEMP/innosetup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 "/DIR=$(cygpath -w "$RUNNER_TEMP/inno")"
          echo "ISCC=$RUNNER_TEMP/inno/ISCC.exe" >> "$GITHUB_ENV"
      - run: |
          rm -rf dist
          scripts/package-windows.sh dist/Tarn
          setup="$(scripts/installer-windows.sh dist/Tarn dist | tail -n1)"
          mv "$setup" "dist/Tarn-${TAG}-windows-x64-setup-unsigned.exe"
          cd dist && 7z a -tzip "Tarn-${TAG}-windows-x64-unsigned.zip" Tarn >/dev/null && rm -rf Tarn
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  linux:
    # Engine updates (chromium-update.yml) and manual runs ship the macOS bundle alone, without waiting for the rest.
    if: (github.event_name == 'push' || inputs.nightly || inputs.full) && github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - if: ${{ !inputs.nightly }}
        run: scripts/check-version.sh "$TAG"
      - run: for package in deb-debian deb-ubuntu rpm arch; do TARN_PKG_PLATFORM=linux/amd64 linux/packaging/build-all.sh "$package"; done
      - run: |
          mkdir dist
          find linux/dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/ \;
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  mobile:
    # Engine updates (chromium-update.yml) and manual runs ship the macOS bundle alone, without waiting for the rest.
    if: (github.event_name == 'push' || inputs.nightly || inputs.full) && github.triggering_actor != format('{0}[bot]', vars.CHROMIUM_UPDATE_APP_SLUG)
    outputs:
      ios: ${{ steps.ios.outputs.artifact-id }}
      android: ${{ steps.android.outputs.artifact-id }}
      android-sbom: ${{ steps.android-sbom.outputs.artifact-id }}
    runs-on: macos-15
    permissions:
      contents: read
    env:
      NSH_RELEASE: https://github.com/longbridge/nsh/releases/download/v0.5.0
      NSH_SHA256: e6722427b391b00cf7ec13137db9366e78d1e7a045f2933cf00b340365309d9d
      NSH_ANDROID_SHA256: bd9f42c043c08f0c29c874d2a8247e389258f88778a5160d646f73fc2ccfbe73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios, aarch64-linux-android, armv7-linux-androideabi
      - if: ${{ !inputs.nightly }}
        run: scripts/check-version.sh "$TAG"
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/nsh.tar.gz" "$NSH_RELEASE/nsh-macos-arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/nsh-android.tar.gz" "$NSH_RELEASE/nsh-android.tar.gz"
          echo "$NSH_SHA256  $RUNNER_TEMP/nsh.tar.gz" | shasum -a 256 -c -
          echo "$NSH_ANDROID_SHA256  $RUNNER_TEMP/nsh-android.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/nsh.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/nsh-android.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nsh/bin" >> "$GITHUB_PATH"
      - name: iOS (unsigned)
        env:
          # mobile/app/nsh.json's MinimumOSVersion; without it Rust links for iOS 10, which lacks
          # ___chkstk_darwin that the C dependencies (built for the SDK's iOS) call.
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          (cd mobile/app && nsh package --target ios -o "$RUNNER_TEMP/ios")
          mkdir "$RUNNER_TEMP/out-ios"
          ditto -c -k --keepParent "$RUNNER_TEMP/ios/Tarn.app" "$RUNNER_TEMP/out-ios/Tarn-${TAG}-ios-unsigned.zip"
      - name: Android (unsigned)
        run: |
          GRADLE_TASK=assembleRelease mobile/android/build.sh
          mkdir "$RUNNER_TEMP/out-android"
          cp mobile/android/host/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out-android/Tarn-${TAG}-android-unsigned.apk"
      - id: ios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: ${{ runner.temp }}/out-ios/
          if-no-files-found: error
      - id: android
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/out-android/
          if-no-files-found: error
      - name: Android Java SBOM
        run: |
          mobile/android/gradle.sh --quiet -Psbom cyclonedxDirectBom
          embed="$(sed -n 's/^EMBED_URL=.*\/download\/v\([^/]*\)\/.*/\1/p' mobile/android/build.sh)"
          hash="$(sed -n 's/^EMBED_SHA256=//p' mobile/android/build.sh)"
          [[ -n "$embed" && -n "$hash" ]] || { echo "EMBED_URL or EMBED_SHA256 not found in mobile/android/build.sh" >&2; exit 1; }
          mkdir "$RUNNER_TEMP/out-android-sbom"
          jq --arg v "$embed" --arg h "$hash" \
            '.components += [{type: "library", name: "nsh-embed-android", version: $v, purl: "pkg:github/longbridge/nsh@v\($v)", hashes: [{alg: "SHA-256", content: $h}]}]' \
            mobile/android/host/build/reports/cyclonedx-direct/bom.json > "$RUNNER_TEMP/out-android-sbom/Tarn-${TAG}-android-java.cdx.json"
      - id: android-sbom
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-sbom
          path: ${{ runner.temp }}/out-android-sbom/
          if-no-files-found: error

  # Signs in a job that runs no build code, with keys that only the signing environments hold
  # (docs/release.md, threat model S4): the macOS bundle with the Developer ID certificate,
  # notarised, as zip, disk image and appcast; the Windows update feed with the update key.
  sign:
    needs: [build, fuzz, deny, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.fuzz.result == 'success' && needs.deny.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: macos-15
    environment: ${{ inputs.nightly && 'nightly-signing' || 'release-signing' }}
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      TARN_SIGN_IDENTITY: "Developer ID Application: Quavon UG (haftungsbeschrankt) (CFV35FGSHF)"
      TARN_NOTARY_PROFILE: tarn-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - if: inputs.nightly
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "nightly version '$VERSION' is not 1.2.3.4" >&2; exit 1; }
          echo "TARN_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: unsigned
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows.result == 'success'
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact }}
          path: windows
          merge-multiple: true
      # A release started on GitHub (start-release.yml) gets its tag here, after a maintainer approved
      # this job: the update app may create v* tags, GitHub Actions itself may not (tag ruleset). The
      # tag's message carries the line "critical" when asked for, as publish-release.sh's does.
      - if: inputs.full
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHROMIUM_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHROMIUM_UPDATE_APP_KEY }}
          permission-contents: write
      - if: inputs.full
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          ACTOR: ${{ github.triggering_actor }}
          CRITICAL_INPUT: ${{ inputs.critical }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "bad tag $TAG or commit $COMMIT" >&2; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists already" >&2
            exit 1
          fi
          message="$TAG, started on GitHub by $ACTOR"
          [[ "$CRITICAL_INPUT" != true ]] || message="$message"$'\n\n'critical
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="$message" -f object="$COMMIT" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
      # A tag whose message has the line "critical" (publish-release.sh --critical, or the critical
      # input above). The checkout holds the tag's commit only, so the tag object is fetched first.
      - if: ${{ !inputs.nightly }}
        run: |
          git fetch -q --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] && git cat-file tag "refs/tags/$TAG" | sed '1,/^$/d' | grep -qx critical; then
            echo "CRITICAL=--critical" >> "$GITHUB_ENV"
          fi
      - name: Keys
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/keys"
          mkdir -m 700 "$keys"
          keychain="$keys/signing.keychain-db"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -ut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$CERTIFICATE" >"$keys/certificate.p12"
          security import "$keys/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$keys/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          printf '%s\n' "$NOTARY_KEY" >"$keys/notary.p8"
          xcrun notarytool store-credentials "$TARN_NOTARY_PROFILE" --key "$keys/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --keychain "$keychain" >/dev/null
          rm "$keys/notary.p8"
          printf '%s' "$UPDATE_KEY" >"$keys/update.key"
          echo "TARN_ED_KEY_FILE=$keys/update.key" >> "$GITHUB_ENV"
      - name: macOS
        run: |
          set -euo pipefail
          mkdir signed work
          ditto -x -k "unsigned/Tarn-${TAG}-unsigned.zip" work
          [[ "$(ls -A work)" == Tarn.app ]] || { echo "the bundle artifact must hold only Tarn.app" >&2; exit 1; }
          scripts/codesign-app.sh work/Tarn.app
          scripts/check-entitlements.sh work/Tarn.app
          scripts/notarize.sh work/Tarn.app
          ditto -c -k --keepParent work/Tarn.app "signed/Tarn-${TAG}.zip"
          scripts/dmg.sh work/Tarn.app "signed/Tarn-${TAG}.dmg"
          scripts/appcast.sh "signed/Tarn-${TAG}.zip" "$TAG" ${CRITICAL:+"$CRITICAL"}
      - name: Windows update feed
        if: needs.windows.result == 'success'
        run: |
          set -euo pipefail
          setup="Tarn-${TAG}-windows-x64-setup-unsigned.exe"
          scripts/windows-feed.sh "windows/$setup" "${TARN_BUILD_VERSION:-${TAG#v}}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" ${CRITICAL:+"$CRITICAL"}
          mv windows/windows-update.json windows/windows-update.json.sig signed/
      - if: always()
        run: |
          [[ -z "${KEYCHAIN:-}" ]] || security delete-keychain "$KEYCHAIN"
          rm -rf "$RUNNER_TEMP/keys"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed/
          if-no-files-found: error

  # Compiles cargo-cyclonedx from crates.io, so it only writes the SBOM and never touches the release files.
  sbom:
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: build
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      clients: ${{ steps.clients.outputs.artifact-id }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-cyclonedx --version "=$CYCLONEDX_VERSION" --locked
      - env:
          CLIENTS: ${{ github.event_name == 'push' || inputs.nightly || inputs.full }}
        run: |
          set -euo pipefail
          sbom() { cargo cyclonedx --format json --spec-version 1.5 --override-filename "$@"; }
          sparkle="$(sed -n 's/^sparkle_version=//p' packaging/sparkle.lock)"
          hash="$(sed -n 's/^sha256=//p' packaging/sparkle.lock)"
          cef="$(sed -n 's/^cef_version=//p' packaging/cef.lock)"
          [[ -n "$sparkle" && -n "$hash" && -n "$cef" ]] || { echo "packaging/sparkle.lock or cef.lock is missing a version or hash" >&2; exit 1; }
          with_cef() {
            jq --arg cef "$cef" '.components += [{type: "framework", name: "Chromium Embedded Framework", version: $cef,
              purl: "pkg:github/chromiumembedded/cef@\($cef | gsub("\\+"; "%2B"))"}]'
          }
          mkdir "$RUNNER_TEMP/sbom"
          sbom tarn.cdx --all-features
          jq --arg v "$sparkle" --arg h "$hash" '.components += [{type: "framework", name: "Sparkle", version: $v,
            purl: "pkg:github/sparkle-project/Sparkle@\($v)", hashes: [{alg: "SHA-256", content: $h}]}]' \
            crates/app/tarn.cdx.json | with_cef > "$RUNNER_TEMP/sbom/Tarn-${TAG}.cdx.json"
          [[ "$CLIENTS" == true ]] || exit 0
          sbom tarn-windows.cdx --target x86_64-pc-windows-msvc
          (cd linux && sbom tarn-linux.cdx --target x86_64-unknown-linux-gnu)
          (cd mobile && sbom tarn-ios.cdx --target aarch64-apple-ios && sbom tarn-android.cdx --target aarch64-linux-android)
          mkdir "$RUNNER_TEMP/sbom-clients"
          with_cef < crates/app-dll/tarn-windows.cdx.json > "$RUNNER_TEMP/sbom-clients/Tarn-${TAG}-windows-x64.cdx.json"
          cp linux/tarn-linux.cdx.json "$RUNNER_TEMP/sbom-clients/Tarn-${TAG}-linux.cdx.json"
          cp mobile/app/tarn-ios.cdx.json "$RUNNER_TEMP/sbom-clients/Tarn-${TAG}-ios.cdx.json"
          cp mobile/app/tarn-android.cdx.json "$RUNNER_TEMP/sbom-clients/Tarn-${TAG}-android.cdx.json"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
      - id: clients
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-clients
          path: ${{ runner.temp }}/sbom-clients/
          if-no-files-found: error

  # Runs no build code: it takes each build job's files by their fixed names, so no job can replace
  # another platform's file, then writes SHA256SUMS and attests it with the binaries and SBOMs.
  # Engine updates (chromium-update.yml) and manual runs ship the macOS bundle alone, without
  # waiting for the rest.
  assets:
    needs: [build, sign, sbom, windows, linux, mobile]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success' && needs.sbom.result == 'success' && (github.event_name != 'push' && !inputs.nightly && !inputs.full || (needs.windows.result == 'success' && needs.linux.result == 'success' && needs.mobile.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: artifacts/bundle
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact }}
          path: artifacts/sbom
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: artifacts/signed
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.sbom.outputs.clients }}
          path: artifacts/sbom-clients
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact }}
          path: artifacts/windows
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.linux.outputs.artifact }}
          path: artifacts/linux
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.mobile.outputs.ios }}
          path: artifacts/ios
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.mobile.outputs.android }}
          path: artifacts/android
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push' || inputs.nightly || inputs.full
        with:
          artifact-ids: ${{ needs.mobile.outputs.android-sbom }}
          path: artifacts/android-sbom
          merge-multiple: true
      - name: Collect assets
        env:
          MACOS_ONLY: ${{ github.event_name != 'push' && !inputs.nightly && !inputs.full }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          mkdir dist
          version="${TAG#v}"
          [[ "$NIGHTLY" != true ]] || version='*'
          # Each artifact must hold exactly the files named here, one per pattern.
          take() {
            local dir="artifacts/$1" pattern file count=0
            shift
            for pattern in "$@"; do
              file="$(find "$dir" -mindepth 1 -maxdepth 1 -type f -name "$pattern")"
              [[ -n "$file" && "$(wc -l <<<"$file")" -eq 1 && ! -e "dist/${file##*/}" ]] \
                || { echo "artifact ${dir##*/} must hold exactly one file matching $pattern" >&2; exit 1; }
              cp "$file" dist/
              count=$((count + 1))
            done
            [[ "$(find "$dir" -mindepth 1 | wc -l)" -eq "$count" ]] || { echo "artifact ${dir##*/} holds other files" >&2; exit 1; }
          }
          take bundle "Tarn-${TAG}-unsigned.zip"
          take sbom "Tarn-${TAG}.cdx.json"
          if [[ "$MACOS_ONLY" == true ]]; then
            take signed "Tarn-${TAG}.zip" "Tarn-${TAG}.dmg" appcast.xml
          else
            take signed "Tarn-${TAG}.zip" "Tarn-${TAG}.dmg" appcast.xml windows-update.json windows-update.json.sig
            take sbom-clients "Tarn-${TAG}-windows-x64.cdx.json" "Tarn-${TAG}-linux.cdx.json" "Tarn-${TAG}-ios.cdx.json" "Tarn-${TAG}-android.cdx.json"
            take windows "Tarn-${TAG}-windows-x64-unsigned.zip" "Tarn-${TAG}-windows-x64-setup-unsigned.exe"
            take linux "tarn_${version}_debian*_amd64.deb" "tarn_${version}_ubuntu*_amd64.deb" \
              "tarn-${version}-*.x86_64.rpm" "tarn-${version}-*-x86_64.pkg.tar.zst"
            take ios "Tarn-${TAG}-ios-unsigned.zip"
            take android "Tarn-${TAG}-android-unsigned.apk"
            take android-sbom "Tarn-${TAG}-android-java.cdx.json"
          fi
          cd dist && sha256sum ./* > SHA256SUMS
      - id: predicate
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit $COMMIT is not a full SHA" >&2; exit 1; }
          echo "json=$(jq -nc --arg commit "$COMMIT" --arg tag "$TAG" '{commit: $commit, tag: $tag}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.apk
            dist/*.cdx.json
            dist/SHA256SUMS
          predicate-type: https://github.com/Quavon-dev/tarn-browser/attestations/release/v1
          predicate: ${{ steps.predicate.outputs.json }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: assets
    concurrency: release-${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Windows checks windows-update.json in the latest release; a macOS-only release carries the last
      # signed one over unchanged, so its signature still holds and Windows keeps a verified feed.
      - if: github.event_name != 'push' && !inputs.nightly && !inputs.full
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view --json assets --jq '.assets[].name')"
          if grep -qx windows-update.json <<<"$assets" && grep -qx windows-update.json.sig <<<"$assets"; then
            gh release download --pattern windows-update.json --pattern windows-update.json.sig --dir dist
          elif grep -qx 'windows-update.json\(\.sig\)\?' <<<"$assets"; then
            echo "the latest release holds only half of the Windows update feed" >&2
            exit 1
          else
            echo "::warning::the latest release has no Windows update feed to carry over"
          fi
      - if: inputs.nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          for id in $(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          fi
          gh release create "$TAG" dist/* --prerelease --latest=false --target "$COMMIT" \
            --title "Nightly $(date -u +%F) (${COMMIT:0:7})" \
            --notes "Nightly build of $COMMIT: the latest changes, before they are tested in a release. Settings › General › Nightly builds updates to it on macOS and Windows."
          [[ "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" == "$COMMIT" ]] \
            || { echo "$TAG does not name $COMMIT" >&2; gh release delete "$TAG" --yes; exit 1; }
      - if: ${{ !inputs.nightly }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            packaging/cef.lock
          sparse-checkout-cone-mode: false
      - if: ${{ !inputs.nightly }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENGINE_UPDATE: ${{ inputs.commit != '' && !inputs.full }}
        run: |
          set -euo pipefail
          tags="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')"
          if grep -qxF "$TAG" <<<"$tags"; then
            echo "a release or draft for $TAG exists already" >&2
            exit 1
          fi
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { found = 1; next } /^## \[/ { found = 0 } found && !/^\[[^]]+\]: /' source/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            [[ "$ENGINE_UPDATE" == true ]] || { echo "CHANGELOG.md has no section for ${TAG#v}" >&2; exit 1; }
            chromium="$(sed -n 's/^chromium_version=//p' source/packaging/cef.lock)"
            cef="$(sed -n 's/^cef_version=//p' source/packaging/cef.lock)"
            [[ -n "$chromium" && -n "$cef" ]] || { echo "packaging/cef.lock names no Chromium version" >&2; exit 1; }
            printf '### Security\n\n- Chromium %s (CEF %s) with its security fixes, on macOS.\n' "$chromium" "$cef" > notes.md
            awk 'index($0, "## [Unreleased]") == 1 { found = 1; next } /^## \[/ { found = 0 } found && !/^\[[^]]+\]: /' source/CHANGELOG.md > unreleased.md
            if grep -q '[^[:space:]]' unreleased.md; then
              printf '\nAlso in this build, from main since the last release:\n' >> notes.md
              cat unreleased.md >> notes.md
            fi
          fi
          gh release create "$TAG" dist/* --verify-tag --latest --title "$TAG" --notes-file notes.md
          gh workflow run linux-repo.yml --ref main
