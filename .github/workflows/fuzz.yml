name: Fuzz

on:
  pull_request:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          mode: code-change
          fuzz-seconds: 300
          github-token: ${{ github.token }}

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          upload-build: true
          github-token: ${{ github.token }}

  batch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          mode: batch
          fuzz-seconds: 3600
          github-token: ${{ github.token }}

  prune:
    needs: batch
    if: ${{ !cancelled() && needs.batch.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ github.token }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          mode: prune
          fuzz-seconds: 600
          github-token: ${{ github.token }}

  coverage:
    needs: prune
    if: ${{ !cancelled() && needs.prune.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage
          github-token: ${{ github.token }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage
          mode: coverage
          fuzz-seconds: 600
          github-token: ${{ github.token }}
