name: Nightly

# Builds main with release.yml into the rolling `nightly` pre-release, signed in the nightly-signing
# environment, which the Nightly update channel reads (docs/release.md, "Nightly builds").
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly

jobs:
  find:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.find.outputs.commit }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          built="$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null)" || built=none
          # After the highest release and before the next, whatever version main already carries.
          highest_release() {
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq -r '[.[][] | select(.draft == false and .prerelease == false)
              | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // "v0.0.0"'
          }
          if [[ "$sha" == "$built" && "$MANUAL" != true ]]; then
            # A release newer than the nightly's base version reaches the Nightly channel as the
            # next nightly, even when main has not moved. A failed lookup skips the night.
            release="$(highest_release)" || release=""
            base="$(gh release download nightly --repo "$GH_REPO" --pattern windows-update.json --output - | jq -er .version)" || base=""
            if [[ -z "$release" || -z "$base" ]]; then
              echo "::warning::could not read the highest release ('$release') or the nightly's version ('$base'); no nightly"
              exit 0
            fi
            if [[ "v${base%.*}" == "$release" ]]; then
              echo "the nightly already holds $sha ($base)"
              exit 0
            fi
          fi
          ci="$(gh run list --workflow ci.yml --branch main --event push --commit "$sha" -L 1 \
            --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')"
          if [[ "$ci" != "completed success" ]]; then
            echo "::warning::CI on $sha is '${ci:-missing}'; no nightly"
            [[ "$MANUAL" != true ]] || exit 1
            exit 0
          fi
          release="$(highest_release)"
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${release#v}.$RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: find
    if: needs.find.outputs.commit != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ needs.find.outputs.commit }}
      tag: nightly
      nightly: true
      version: ${{ needs.find.outputs.version }}
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
