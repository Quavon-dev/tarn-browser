name: Linux repositories

# Started by release-published.yml, by hand or weekly; rebuilds the apt and dnf repositories on GitHub
# Pages from the newest published releases, re-signing them before Valid-Until lapses, and updates the
# AUR package.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: linux-repo

env:
  RELEASES: 3

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: linux-repo
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.download.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name | test("\\.(deb|rpm)$"))) | .tag_name')"
          tags="$(head -n "$RELEASES" <<<"$tags")"
          [[ -n "$tags" ]] || { echo "no published release has Linux packages" >&2; exit 1; }
          mkdir packages
          for tag in $tags; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag $tag" >&2; exit 1; }
            gh release download "$tag" --pattern '*.deb' --pattern '*.rpm' --dir "downloads/$tag"
            for file in "downloads/$tag"/*; do
              gh attestation verify "$file" --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "refs/tags/$tag" \
                --predicate-type https://github.com/Quavon-dev/tarn-browser/attestations/release/v1 >/dev/null
              mv "$file" packages/
            done
          done
          echo "tag=$(head -n1 <<<"$tags")" >> "$GITHUB_OUTPUT"
      - env:
          TARN_REPO_GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
          TARN_REPO_GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "$PWD":/work:ro -v "$PWD/packages":/in:ro -v "$RUNNER_TEMP/site":/out \
            -e TARN_REPO_GPG_KEY -e TARN_REPO_GPG_PASSPHRASE \
            debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 \
            sh /work/linux/packaging/repo/build.sh /in /out
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  aur:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: aur
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; the AUR package is not updated"
            exit 0
          fi
          linux/packaging/arch/aur.sh "$TAG"
