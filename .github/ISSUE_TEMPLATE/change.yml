name: Change proposal
description: A large refactor, architecture, dependency or behaviour change. Maintainers vote on it with 👍 or 👎.
labels: ["type: change", "status: voting"]
body:
  - type: markdown
    attributes:
      value: |
        Maintainers vote with 👍 or 👎 on this issue. One 👍 from a maintainer other than the author (and more 👍 than 👎) moves it to `status: approved`; more 👎 than 👍 moves it to `status: rejected`. The vote shows whether the change is wanted; a pull request is decided in its review.
  - type: textarea
    id: change
    attributes:
      label: Change
      description: What changes and why now.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Crates, users, data, privacy or security affected, and what could break.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and rollback
