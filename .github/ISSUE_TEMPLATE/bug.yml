name: Bug report
description: Something in Tarn does not work as it should.
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Security problems go through the Security tab, never a public issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tarn version or commit
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: macOS 15.3, Windows 11 24H2, Fedora 43, iOS 18.2, Android 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
