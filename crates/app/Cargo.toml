[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Tarn desktop app for macOS and Windows, built on GPUI."
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[[bin]]
name = "tarn"
path = "src/main.rs"

[features]
chromium = ["engine/chromium"]
translation = ["engine/translation"]
foundation-models = ["engine/foundation-models"]

[dependencies]
devkit.workspace = true
platform.workspace = true
browser-core.workspace = true
engine.workspace = true
futures = "0.3"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
shield.workspace = true
store.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
ui.workspace = true
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = "=3.0.0"
tempfile.workspace = true
