[package]
name = "browser-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-neutral browser state, decisions and persistence shared by every Tarn client."
repository.workspace = true
publish.workspace = true

[dependencies]
cssparser = { version = "=0.38.0", default-features = false }
engine.workspace = true
psl = "=2.1.252"
import.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
shield.workspace = true
store.workspace = true
unicode-normalization = "=0.1.25"
url.workspace = true
uuid = { version = "1", features = ["v4"] }
x509-cert = { version = "=0.3.1", default-features = false, features = ["std"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
