[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS and Windows platform services for Tarn: XPC, credentials, memory pressure and the updater."
repository.workspace = true
publish.workspace = true

[dependencies]
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
