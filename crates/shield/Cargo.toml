[package]
name = "shield"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tarn Shield: content blocking, filter lists and protection levels."
repository.workspace = true
publish.workspace = true

[dependencies]
url.workspace = true
serde_json = "1"
adblock = { version = "=0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
ed25519-dalek = "=3.0.0"
psl = "=2.1.252"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.1"

[lints]
workspace = true

[dev-dependencies]
regex = "1"
tempfile.workspace = true
