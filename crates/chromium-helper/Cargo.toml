[package]
name = "chromium-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Helper process for Tarn's embedded Chromium (CEF) engine on macOS."
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tarn-chromium-helper"
path = "src/main.rs"

[features]
chromium = ["dep:cef"]

[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "=156.7.0", default-features = false, features = ["sandbox"], optional = true }

[lints]
workspace = true
