[package]
name = "tarn-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
browser-core = { path = "../crates/browser-core" }
devkit = { path = "../crates/devkit" }
ed25519-dalek = "=3.0.0"
engine = { path = "../crates/engine" }
import = { path = "../crates/import" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.154"
shield = { path = "../crates/shield" }
store = { path = "../crates/store" }
url = "=2.5.9"

[profile.release]
debug = 1

