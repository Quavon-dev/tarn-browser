android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
# Maven Central answers bursts with 429; Gradle retries that, but by default only three times within
# three seconds before it disables the repository for the build.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=5000
